[package]
name = "soundhood"
version = "0.2.1"
description = "Soundhood: local-first music player + downloader"
authors = ["Soundhood contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soundhood_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri crates are pinned to a minor (`~`) because the CLI refuses a Rust crate and its npm twin
# on different minors: tauri <-> @tauri-apps/api + @tauri-apps/cli, each plugin <-> its JS package.
# Bump both sides together (app/package.json) and run `cargo update -p <crate>` from the repo root.
[build-dependencies]
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "~2.8.3"
tauri-plugin-store = "~2.5.0"
# Rust-only: spawns the desktop sidecars; the webview never calls it.
tauri-plugin-shell = "~2.5.0"
# Soundhood's own mobile plugin: yt-dlp on the phone (no-op on desktop, which has the sidecar)
tauri-plugin-soundhood-ytdl = { path = "plugins/soundhood-ytdl" }

# The core does every library read and write. Desktop adds the sidecar manager (fetch + verify
# yt-dlp and deno); the phone runs yt-dlp through the plugin and needs no HTTP client in Rust.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
soundhood-core = { path = "../../core", features = ["sidecars"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
soundhood-core = { path = "../../core" }

[dev-dependencies]
tempfile = "3"
