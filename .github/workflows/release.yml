# Tag-triggered release skeleton: the Windows installer and the Linux AppImage + .deb, attached to
# a draft GitHub release for the tag.
#
# Until Phase 2 the installer still carries yt-dlp and deno (docs/DECISIONS.md, the migration rule):
# each job builds soundhood-tools, fetches the pinned yt-dlp and deno with it (verified against the
# published SHA-256 and core/src/ytdlp/pins.rs), and only then checks that no placeholder is left.
#
# TODO(Phase 7): complete this pipeline - macOS DMG on macos-14 (ad-hoc signed); the Linux smoke
# test (launch against the fixture library, take a screenshot, run the sidecar manager against a
# local fixture HTTP server); libmpv bundled in the AppImage and `libmpv2` as a .deb dependency;
# the bundled ffmpeg (LGPL build) fetched and verified here; publishing instead of a draft.
# The phone APK is never built here: it is signed with the owner's key, which never enters CI.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "24"

jobs:
  version:
    name: tag matches the app version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # tauri.conf.json is the app version (Tauri derives the Android version code from it);
      # app/package.json and app/src-tauri/Cargo.toml are kept equal to it (docs/DEV.md).
      - name: Compare the tag with tauri.conf.json, package.json and Cargo.toml
        shell: bash
        run: |
          conf=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./app/package.json').version")
          crate=$(grep -m1 -E '^version = "' app/src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag $GITHUB_REF_NAME, tauri.conf.json $conf, package.json $pkg, Cargo.toml $crate"
          if [ "v$conf" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version v$conf (app/src-tauri/tauri.conf.json)"
            exit 1
          fi
          if [ "$pkg" != "$conf" ] || [ "$crate" != "$conf" ]; then
            echo "::error::versions differ: tauri.conf.json $conf, app/package.json $pkg, app/src-tauri/Cargo.toml $crate"
            exit 1
          fi

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: app - npm ci
        working-directory: app
        run: npm ci
      # soundhood-tools ships next to Soundhood (externalBin). beforeBuildCommand builds it again
      # later, a no-op by then; building it here lets the check below see it.
      - name: Build soundhood-tools
        working-directory: app
        run: npm run build:tools
      - name: Fetch the pinned yt-dlp and deno (verified)
        run: cargo run -p soundhood-core --release --locked --features tools --bin soundhood-tools -- fetch-sidecars app/src-tauri/bin
      - name: Sidecars present (no placeholders in a release)
        run: node .github/scripts/sidecars.mjs check
      - name: Build the NSIS installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage and .deb
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # linuxdeploy is itself an AppImage; run it without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: ./.github/actions/rust
        with:
          cache-key: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: app - npm ci
        working-directory: app
        run: npm ci
      - name: Build soundhood-tools
        working-directory: app
        run: npm run build:tools
      - name: Fetch the pinned yt-dlp and deno (verified)
        run: cargo run -p soundhood-core --release --locked --features tools --bin soundhood-tools -- fetch-sidecars app/src-tauri/bin
      - name: Sidecars present (no placeholders in a release)
        run: node .github/scripts/sidecars.mjs check
      - name: Build the AppImage and the .deb
        working-directory: app
        run: npm run tauri build -- --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    name: attach to a draft release
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: List the artefacts
        run: ls -l dist
      # A draft: the lead publishes it after the phase gate (the tag is made on the merge commit).
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
